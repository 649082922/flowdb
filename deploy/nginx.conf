events {}

http {
  server_tokens off;
  client_max_body_size 1m;

  upstream flowdb_web { server web:3000; }
  upstream flowdb_api { server api:8000; }

  server {
    listen 8080;

    location /api/ {
      proxy_pass http://flowdb_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location /health {
      proxy_pass http://flowdb_api/health;
    }

    location / {
      proxy_pass http://flowdb_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

